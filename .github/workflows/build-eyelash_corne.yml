name: 'Build eyelash corne'
on: workflow_dispatch
jobs:
  build:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["eyelash_corne_left", "eyelash_corne_right"]'
      shield: '["nice_view"]'
      alphas: '["dvorak"]'
      custom_config: '["#define MIRYOKU_TAP_GAMING\n#define MIRYOKU_DVORAK_SWAP"]'
      branches: '["zmkfirmware/zmk/v0.3.0"]'
      modules: '["a741725193/zmk-new_corne/main"]'
